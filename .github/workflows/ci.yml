name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  classify-production-ci:
    name: classify production CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify_production_ci.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    needs: classify-production-ci
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.3'

      - name: Run Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

      - name: Validate release gate policy
        run: |
          python3 .github/scripts/test_release_pr_auto_merge.py -v
          python3 .github/scripts/test_release_pr_ci_gate.py -v
          python3 .github/scripts/test_classify_production_ci.py -v
          python3 .github/scripts/test_validate_next_provenance.py -v
          python3 .github/scripts/test_verify_packagist_release.py -v

  test:
    needs: classify-production-ci
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.3'

      - name: Run bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
